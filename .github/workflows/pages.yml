name: Deploy Web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install runtime libraries for headless export
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libglu1-mesa libxcursor1 libxinerama1 libxrandr2 libxi6 || true
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2 || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official single-thread Web export template
        run: python3 tools/fetch_web_template.py --extract

      - name: Build Web export
        env:
          WEB_BUILD_TIMEOUT: '600'
        run: python3 tools/build_web.py

      - name: Show build output
        run: ls -lh dist && cat dist/build-manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
